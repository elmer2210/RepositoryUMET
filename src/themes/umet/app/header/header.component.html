<header>
  <div class="container">
    <div class="d-flex flex-row justify-content-between align-items-center">

      <!-- Logo -->
      <a class="navbar-brand umet-header-brand my-2" routerLink="/home">
        <img class="umet-header-logo" src="/assets/umet/images/umet_header.svg" [attr.alt]="'menu.header.image.logo' | translate"/>
      </a>

      <!-- Right side: branding text + user controls -->
      <div class="d-flex align-items-center">
        <span class="umet-repo-brand d-none d-lg-block">Repositorio <strong>Digital</strong></span>

        <nav role="navigation" [attr.aria-label]="'nav.user.description' | translate" class="navbar navbar-dark navbar-expand-md flex-shrink-0 px-0">
          <ds-themed-search-navbar></ds-themed-search-navbar>
          <ds-lang-switch></ds-lang-switch>
          <ds-context-help-toggle></ds-context-help-toggle>
          <ds-themed-auth-nav-menu></ds-themed-auth-nav-menu>
          <ds-impersonate-navbar></ds-impersonate-navbar>
          <div class="pl-2">
            <button class="navbar-toggler" type="button" (click)="toggleNavbar()"
                    aria-controls="collapsingNav"
                    aria-expanded="false" [attr.aria-label]="'nav.toggle' | translate">
              <span class="navbar-toggler-icon fas fa-bars fa-fw" aria-hidden="true"></span>
            </button>
          </div>
        </nav>
      </div>

    </div>
  </div>
</header>
