<ds-truncatable [id]="dso.id" *ngIf="object !== undefined && object !== null">
  <div class="umet-item-card">
    <div class="umet-card-inner">

      <!-- ── COLUMNA IZQUIERDA: thumbnail ────────────────────────────── -->
      <div class="umet-thumb-col">
        <ng-container *ngVar="dso?.thumbnail | async as thumbRD">
          <a *ngIf="linkType != linkTypes.None"
             [target]="(linkType == linkTypes.ExternalLink) ? '_blank' : '_self'"
             [attr.rel]="(linkType == linkTypes.ExternalLink) ? 'noopener noreferrer' : null"
             [routerLink]="[itemPageRoute]"
             class="umet-thumb-link">
            <ds-thumbnail *ngIf="thumbRD?.payload; else iconDoc"
                          [thumbnail]="thumbRD" [limitWidth]="false"></ds-thumbnail>
            <ng-template #iconDoc>
              <div class="umet-thumb-placeholder"><i class="fas fa-file-alt"></i></div>
            </ng-template>
          </a>
          <span *ngIf="linkType == linkTypes.None" class="umet-thumb-link">
            <ds-thumbnail *ngIf="thumbRD?.payload; else iconDoc2"
                          [thumbnail]="thumbRD" [limitWidth]="false"></ds-thumbnail>
            <ng-template #iconDoc2>
              <div class="umet-thumb-placeholder"><i class="fas fa-file-alt"></i></div>
            </ng-template>
          </span>
        </ng-container>
      </div>

      <!-- ── COLUMNA DERECHA: contenido ─────────────────────────────── -->
      <div class="umet-content-col">

        <!-- Fila 1: badge de tipo + icono de acceso -->
        <div class="umet-item-badges">
          <span *ngIf="itemTypeLabel"
                class="umet-type-badge umet-type-{{ typeClass }}">
            {{ itemTypeLabel }}
          </span>
          <span *ngIf="accessInfo"
                class="umet-access-icon umet-access-{{ accessInfo.cssClass }}"
                [title]="accessInfo.label">
            <i class="fas {{ accessInfo.icon }}"></i>
          </span>
        </div>

        <!-- Fila 2: título -->
        <div class="umet-title-row">
          <a *ngIf="linkType != linkTypes.None"
             [target]="(linkType == linkTypes.ExternalLink) ? '_blank' : '_self'"
             [attr.rel]="(linkType == linkTypes.ExternalLink) ? 'noopener noreferrer' : null"
             [routerLink]="[itemPageRoute]"
             class="umet-item-title dont-break-out"
             [innerHTML]="dsoNameService.getName(dso)">
          </a>
          <span *ngIf="linkType == linkTypes.None"
                class="umet-item-title dont-break-out"
                [innerHTML]="dsoNameService.getName(dso)">
          </span>
        </div>

        <!-- Fila 3: (Institución, Fecha) Autor1; Autor2 -->
        <ds-truncatable-part [id]="dso.id" [minLines]="1">
          <div class="umet-item-meta">
            <ng-container *ngIf="dso.firstMetadataValue('dc.publisher') || dso.firstMetadataValue('dc.date.issued')">
              <span class="umet-meta-institution">
                (<span *ngIf="dso.firstMetadataValue('dc.publisher')"
                       [innerHTML]="dso.firstMetadataValue('dc.publisher')"></span><span
                  *ngIf="dso.firstMetadataValue('dc.publisher') && dso.firstMetadataValue('dc.date.issued')">, </span><span
                  *ngIf="dso.firstMetadataValue('dc.date.issued')">{{ dso.firstMetadataValue('dc.date.issued') | slice:0:10 }}</span>)
              </span>
            </ng-container>
            <span *ngIf="dso.allMetadata(['dc.contributor.author', 'dc.creator', 'dc.contributor.*']).length > 0"
                  class="umet-item-authors">
              <span *ngFor="let author of allMetadataValues(['dc.contributor.author', 'dc.creator', 'dc.contributor.*']); let last=last;">
                <span [innerHTML]="author"></span><span *ngIf="!last">; </span>
              </span>
            </span>
          </div>
        </ds-truncatable-part>

        <!-- Fila 4: abstract truncado -->
        <div *ngIf="dso.firstMetadataValue('dc.description.abstract')"
             class="umet-item-abstract">
          <ds-truncatable-part [id]="dso.id" [minLines]="3">
            <span [innerHTML]="dso.firstMetadataValue('dc.description.abstract')"></span>
          </ds-truncatable-part>
        </div>

      </div><!-- /umet-content-col -->
    </div><!-- /umet-card-inner -->
  </div><!-- /umet-item-card -->
</ds-truncatable>
