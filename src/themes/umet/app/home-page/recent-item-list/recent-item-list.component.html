<ng-container *ngVar="(itemRD$ | async) as itemRD">

  <div *ngIf="itemRD?.hasSucceeded && itemRD?.payload?.page.length > 0" @fadeIn>

    <!-- Section heading -->
    <h2 class="umet-section-heading">{{ 'home.recent-submissions.head' | translate }}</h2>

    <!-- Item cards -->
    <div class="umet-item-list">
      <div *ngFor="let item of itemRD?.payload?.page" class="umet-item-wrapper">
        <ds-listable-object-component-loader [object]="item" [viewMode]="viewMode">
        </ds-listable-object-component-loader>
      </div>
    </div>

  </div>

  <ds-error *ngIf="itemRD?.hasFailed"
            message="{{ 'error.recent-submissions' | translate }}">
  </ds-error>
  <ds-loading *ngIf="!itemRD || itemRD.isLoading"
              message="{{ 'loading.recent-submissions' | translate }}">
  </ds-loading>

</ng-container>
